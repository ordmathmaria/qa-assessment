name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: |
           echo "STANDARD_USER=${{ secrets.STANDARDUSER }}" >> .env
           echo "USER_PASSWORD=${{ secrets.USERPASSWORD }}" >> .env
           echo "LOCKED_USER=${{ secrets.LOCKEDUSER }}" >> .env
           echo "PROBLEM_USER=${{ secrets.PROBLEMUSER }}" >> .env
           echo "INVALID_USER=${{ secrets.INVALIDUSER }}" >> .env
           echo "INVALID_PASSWORD=${{ secrets.INVALIDPASSWORD }}" >> .env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Evidence (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore